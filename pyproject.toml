[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pharmacy-invoice-automation"
version = "0.1.0"
description = "Desktop automation system that OCRs pharmacy purchase invoices and imports them into webnhathuoc.com."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Pharmacy Automation Project" }]

# Runtime dependencies, matching Technical Design Document Section 3
# (Technology Stack). Versions are intentionally left as minimum-only
# floors; exact pins are a Prompt 05+ concern once real integration
# testing begins.
dependencies = [
    "PySide6>=6.7",
    "playwright>=1.45",
    "google-genai>=0.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "opencv-python>=4.10",
    "Pillow>=10.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "keyring>=25.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-qt>=4.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
pharmacy-invoice-automation = "pharmacy_invoice_automation.composition_root.bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmacy_invoice_automation"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["pharmacy_invoice_automation"]
# infrastructure.di.ServiceContainer is a generic type-to-instance
# registry BY DESIGN keyed on abstract Domain/Application ports (its own
# whole purpose per its docstring) -- resolve()/register_instance()/
# register_factory() never instantiate the type, only use it as a dict
# key, so mypy's "type-abstract" check (which assumes type[X] always
# implies "a constructor for X") is a structural false positive here,
# not a real bug. Composition Root (registration.py, cli.py, and every
# later stage) calls container.resolve(SomeAbstractPort) dozens of
# times by design -- disabled globally rather than via a type: ignore
# at every one of those call sites (2026-08).
disable_error_code = ["type-abstract"]
