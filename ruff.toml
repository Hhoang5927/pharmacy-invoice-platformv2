line-length = 100
target-version = "py312"
src = ["src", "tests"]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "N",   # pep8-naming (supports PascalCase class / snake_case function convention)
]
ignore = []

[lint.isort]
known-first-party = ["pharmacy_invoice_automation"]

[format]
quote-style = "double"
indent-style = "space"
