[pytest]
minversion = 8.0
testpaths = tests
pythonpath = src

markers =
    unit: fast, fully-isolated unit tests (domain, application against fakes)
    integration: tests exercising a real dependency (SQLite, full pipeline)
    golden: OCR golden-file regression tests
    e2e: Playwright automation tests against staging or fixture HTML
    ui: pytest-qt widget-level tests
    load: high-volume load tests (500 / 1000+ simulated invoices)

addopts = -ra --strict-markers
